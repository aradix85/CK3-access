name = "ck3Access"
summary = "CK3 Access: automatic sleep mode"
version = "1.0.0"
author = "ck3_access"
description = "Puts NVDA into sleep mode while Crusader Kings III has focus. The reader speaks for itself through the NVDA controller client, so NVDA's own reporting is duplication and its keys are keys the game cannot have. Speech and braille from the controller client keep working: NVDA's speak handler only returns early for SLEEP_FULL, which ordinary sleep mode does not set."
minimumNVDAVersion = "2023.1"
lastTestedNVDAVersion = "2026.1.1"
