# Tooling configuration. Windows only; what to install is in requirements.txt.
#
# There is no package here to build or install: `tools` is a package of scripts run in place from the
# project folder, as `python -m tools.<name>`. This file exists for ruff, mypy and pytest and nothing else.

[tool.ruff]
line-length = 100
# The oldest Python the README promises; ruff reports syntax that needs a newer one.
target-version = "py311"
# Files .gitignore keeps out of the repository are code all the same, and a check that skips them in
# silence looks exactly like one that passed them.
respect-gitignore = false

[tool.ruff.lint]
# **ruff's own default selection**, whatever the installed version holds: a version that widens it
# shows up as new findings, and those are fixed rather than switched off (the maintainer's decision,
# 3 October 2026).
# **No line-length rule**, decided 16 September 2026 after measuring what one would cost: 20 lines
# between 101 and 107
# characters across ten files, none of them hard to read, and the maintainer does not read the
# source at all. A rule that produces twenty chores on the day it is switched on, for a reader who
# does not exist yet, is the kind of check people learn to ignore. Add one when a contributor asks.

# **Two sets on top of the default, measured 2 October 2026 against every set ruff has.** Of 801
# findings across them nearly all were style or a deliberate choice; these two pointed at real
# faults. B905: `zip` without `strict=` cuts the longer list off without a word, and silence is
# what this project worries about most - two cases in the text recogniser. ARG: a parameter nobody
# uses is dead code a caller still has to fill - three of them. A name starting with an underscore
# is a signature someone else fixed, such as a Windows callback.
extend-select = ["B905", "ARG"]

[tool.mypy]
# Every function body is checked, annotated or not (the maintainer's decision, 3 October 2026: no
# check is switched off because that is easier). `tools` is a package; the tests are found from the
# project folder.
files = ["tools", "tests"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true
# The flags of --strict that the whole project already meets, on for every module so none slips back.
# The three it does not meet yet are switched on per module below, as each module gets real types.
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
strict_bytes = true
extra_checks = true

[[tool.mypy.overrides]]
# Modules with real types throughout: the rest of --strict, so they cannot slip back. A module joins
# once it is clean; when the last one has, these move up into [tool.mypy] as strict = true.
module = ["tools.paths", "tools.terminal", "tools.nvda.speech", "tools.ck3.inject", "tools.ck3.memory",
          "tools.ck3.channel", "tools.ck3.vtablemap", "tools.ck3.start_game", "tools.restore_launcher",
          "tools.screenshot", "tools.nvda.check_speech_by_ear", "tools.nvda.addon.appModules.ck3",
          "tools.windowgrab", "tools.toolindex", "tools.ocr", "tools.boxreader", "tools.ck3.savegame",
          "tools.ck3.guimap", "tools.ck3.database", "tools.ck3.screens", "tools.ck3.propose",
          "tools.ck3.derive", "tools.ck3.mapdata", "tools.ck3.pairing", "tools.never_silent",
          "tools.check", "tools.ck3.anchor", "tools.ck3.model", "tools.ck3.numbering",
          "tools.ck3.calibrate", "tools.ck3.place",
          # The tests: `tests` has no __init__.py, and mypy takes it as a namespace package.
          "tests.test_ask_retry", "tests.test_channel", "tests.test_scan_guard",
          "tests.test_speech_seam", "tests.test_tree_walk"]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true

[[tool.mypy.overrides]]
# OpenVINO ships no type information, so there is nothing to check its calls against.
module = ["openvino"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NVDA's own module: it exists only inside NVDA, which loads the add-on.
module = ["appModuleHandler"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Only `tests\` is collected. Anything under `tools\` that is run by hand speaks through NVDA and
# sleeps, so collecting it would make a test run talk - see tools\nvda\check_speech_by_ear.py.
testpaths = ["tests"]
# The tests import the tools as the package they are, from the project folder.
pythonpath = ["."]
# A warning is a failure, and every skip is listed with its reason: a run that is green because
# something was not looked at must not read like one that looked (the maintainer's decision, 3 October
# 2026: no check is switched off because that is easier).
filterwarnings = ["error"]
addopts = "-rs"
